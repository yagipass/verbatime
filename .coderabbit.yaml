# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary: false
  path_filters:
    - "!flake.lock"
    - "!docs/pnpm-lock.yaml"
    - "!.github/workflows/actions.lock"
  auto_review:
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
  tools:
    markdownlint:
      enabled: false
    pmd:
      enabled: false
knowledge_base:
  code_guidelines:
    filePatterns:
      - CONTRIBUTING.md
