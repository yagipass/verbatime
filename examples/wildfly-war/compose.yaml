services:
  app:
    build:
      context: ../..
      dockerfile: examples/wildfly-war/Dockerfile
    ports:
      - "8080:8080"
      - "${JMX_BIND:-127.0.0.1}:7091:7091"
    environment:
      JAVA_OPTS: >-
        -javaagent:/opt/jboss/wildfly/verbatime-agent.jar=waitstart=60s,roots=org.jboss.as.server.Main::main+io.undertow.servlet.handlers.ServletInitialHandler::dispatchRequest,exclude=org.jboss.modules+org.jboss.marshalling,${VERBATIME_EXTRA:-}
        -Dcom.sun.management.jmxremote.port=7091
        -Dcom.sun.management.jmxremote.rmi.port=7091
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=${JMX_HOST:-localhost}
        -Djboss.modules.system.pkgs=org.jboss.byteman,org.jboss.logmanager,org.wildfly.common,io.smallrye.common,io.github.yagipass.verbatime.agent.probe
        -Djava.net.preferIPv4Stack=true
        -Djava.awt.headless=true
        -Xms64m
        -Xmx512m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

  load:
    image: ghcr.io/hatoo/oha:1.16
    profiles: [load]
    depends_on:
      app:
        condition: service_healthy
    command: ["-z", "30s", "-c", "8", "--no-tui", "http://app:8080/orders?sku=widget&qty=3"]
