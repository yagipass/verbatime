apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: verbatime
  owner: yagipass
spec:
  description: Java method tracing profiler. Records every method call under the methods you choose, with nothing sampled, and shows each run as a flame chart in JDK Mission Control.
  homepage: https://verbatime.yagipass.com
  visibility: public
  archived: false
  topics:
  - bytecode
  - instrumentation
  - java
  - javaagent
  - jdk-mission-control
  - jvm
  - performance
  - profiler
  - tracing
  - flame-chart
  - bytecode-instrumentation
  - flamegraph
  - java-profiler
  - jmc
  - method-tracing
  - performance-analysis
  - profiling
  - agent-skills
  labels:
  - name: accessibility
    description: Barrier affecting people with disabilities
    color: f143ab
  - name: agent
    description: Pull requests that change the shipped agent code
    color: 5319e7
  - name: benchmark
    description: Pull requests that change the overhead benchmark
    color: d4c5f9
  - name: bug
    description: Something isn't working
    color: d73a4a
  - name: cli
    description: Pull requests that change the shipped vbtm CLI code
    color: 1d76db
  - name: dependencies
    description: Pull requests that update a dependency file
    color: 0366d6
  - name: docker
    description: Pull requests that update docker code
    color: 21ceff
  - name: documentation
    description: Improvements or additions to documentation
    color: 0075ca
  - name: duplicate
    description: This issue or pull request already exists
    color: cfd3d7
  - name: enhancement
    description: New feature or request
    color: a2eeef
  - name: examples
    description: Pull requests that change the examples or their dependencies
    color: bfd4f2
  - name: github_actions
    description: Pull requests that update GitHub Actions code
    color: "000000"
  - name: good first issue
    description: Good for newcomers
    color: 7057ff
  - name: help wanted
    description: Extra attention is needed
    color: 008672
  - name: invalid
    description: This doesn't seem right
    color: e4e669
  - name: java
    description: Pull requests that update java code
    color: ffa221
  - name: javascript
    description: Pull requests that update javascript code
    color: "168700"
  - name: jmc
    description: Pull requests that change the shipped JMC plugin code
    color: fbca04
  - name: maintenance
    description: Build, CI, and refactoring work that users do not see
    color: c5def5
  - name: nix
    description: Pull requests that update nix code
    color: 3E6399
  - name: performance
    description: Makes something faster or lighter
    color: 2cbe4e
  - name: question
    description: Further information is requested
    color: d876e3
  - name: tagpr
    color: ededed
  - name: tagpr:minor
    color: 7BA492
  - name: wontfix
    description: This will not be worked on
    color: ffffff
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: true
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true
  rulesets:
  - name: protect-main
    target: branch
    enforcement: active
    bypass_actors:
    - role: admin
      bypass_mode: pull_request
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      pull_request:
        required_approving_review_count: 0
        dismiss_stale_reviews_on_push: false
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: false
      required_status_checks:
        strict_required_status_checks_policy: false
        contexts:
        - context: agent
          app: github-actions
        - context: jmc
          app: github-actions
        - context: cli
          app: github-actions
        - context: docs
          app: github-actions
        - context: checks (macos-latest)
          app: github-actions
        - context: checks (ubuntu-24.04-arm)
          app: github-actions
        - context: checks (ubuntu-latest)
          app: github-actions
      non_fast_forward: true
      update: false
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  - name: protect-release-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
        - refs/tags/v*
    rules:
      non_fast_forward: false
      update: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: true
    fork_pr_approval: first_time_contributors
