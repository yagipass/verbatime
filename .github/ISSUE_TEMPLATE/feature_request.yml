name: Feature request
description: Suggest something Verbatime could do.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [Limitations](https://verbatime-docs.yagipass.com/limitations/) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where Verbatime falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would like, with example usage if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do now instead, and other options you considered.
  - type: textarea
    id: checked
    attributes:
      label: Checked so far
      description: What you tried and what it showed. End with what you have not checked yet.
