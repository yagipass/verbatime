name: Documentation
description: Something in the docs is wrong, missing, or unclear.
title: "doc: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL, or the file path in this repository.
      placeholder: https://verbatime-docs.yagipass.com/quick-start/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, missing, or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
