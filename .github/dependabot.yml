version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      eclipse:
        patterns: ["org.eclipse.platform:*", "org.osgi:*"]
      jackson:
        patterns: ["com.fasterxml.jackson.core:*"]
      jboss-marshalling:
        patterns: ["org.jboss.marshalling:*"]
      jetty:
        patterns: ["org.eclipse.jetty:*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin:*"]
      log4j:
        patterns: ["org.apache.logging.log4j:*"]
      logback:
        patterns: ["ch.qos.logback:*"]
      micrometer:
        patterns: ["io.micrometer:*"]
      netty:
        patterns: ["io.netty:*"]
      scala2:
        patterns: ["org.scala-lang:scala-library", "org.scala-lang:scala-compiler", "org.scala-lang:scala-reflect"]
      scala3:
        patterns: ["org.scala-lang:scala3-*", "org.scala-lang:tasty-core_3"]
      spring-boot:
        patterns: ["org.springframework.boot:*"]
      spring-framework:
        patterns: ["org.springframework:*"]
      xalan:
        patterns: ["xalan:*"]
    ignore:
      - dependency-name: "junit:junit"
      - dependency-name: "net.bytebuddy:byte-buddy"
      - dependency-name: "io.netty:*"
        versions: ["[4.2,)"]
      - dependency-name: "org.scala-lang:scala-library"
        versions: ["[3,)"]
      - dependency-name: "org.scala-lang:scala3-library_3"
        versions: ["[3.8,)"]
      - dependency-name: "org.scala-lang:scala3-compiler_3"
        versions: ["[3.8,)"]
      - dependency-name: "org.scala-lang:scala3-interfaces"
        versions: ["[3.8,)"]
      - dependency-name: "org.scala-lang:tasty-core_3"
        versions: ["[3.8,)"]

  - package-ecosystem: maven
    directory: /examples
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directories: ["/examples/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/examples/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /examples/junit-gradle
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      flake-inputs:
        patterns: ["*"]
