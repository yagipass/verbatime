version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      eclipse:
        patterns: ["org.eclipse.platform:*", "org.osgi:*"]
    ignore:
      - dependency-name: "junit:junit"
      - dependency-name: "net.bytebuddy:byte-buddy"
      - dependency-name: "io.netty:*"
        versions: ["[4.2,)"]
      - dependency-name: "org.scala-lang:scala-library"
        versions: ["[3,)"]
      - dependency-name: "org.scala-lang:scala3-library_3"
        versions: ["[3.8,)"]

  - package-ecosystem: maven
    directory: /examples
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directories: ["/examples/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/examples/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /examples/junit-gradle
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      flake-inputs:
        patterns: ["*"]
