name: examples

on:
  pull_request:
    paths:
      - examples/**
      - modules/agent/src/main/**
      - modules/agent/pom.xml
      - modules/agent/MANIFEST.MF
      - modules/format/src/main/**
      - modules/format/pom.xml
      - pom.xml
      - .mvn/**
      - .dockerignore
      - .github/workflows/examples.yml
  push:
    branches: [main]
    paths:
      - examples/**
      - modules/agent/src/main/**
      - modules/agent/pom.xml
      - modules/agent/MANIFEST.MF
      - modules/format/src/main/**
      - modules/format/pom.xml
      - pom.xml
      - .mvn/**
      - .dockerignore
      - .github/workflows/examples.yml
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "examples=$(printf '%s\n' examples/*/Dockerfile | cut -d/ -f2 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.list.outputs.examples) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/yagipass/verbatime-example-${{ matrix.example }}
          flavor: latest=false
          tags: |
            type=ref,event=pr,enable=${{ inputs.version == '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - if: inputs.version != ''
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if out=$(docker buildx imagetools inspect "$tag" 2>&1); then
              echo "::error::$tag already exists"
              exit 1
            fi
            if [[ $out != *": not found"* ]]; then
              echo "$out" >&2
              exit 1
            fi
          done
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: examples/${{ matrix.example }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
