name: release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-caller
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.tagpr.outputs.tag != ''
        uses: cachix/install-nix-action@v31.11.1
      - if: steps.tagpr.outputs.tag != ''
        uses: cachix/cachix-action@v17
        with:
          name: verbatime
      - if: steps.tagpr.outputs.tag != ''
        run: |
          nix develop .#jmc   --command mvn -B -pl modules/jmc   -am verify
          nix develop .#cli   --command mvn -B -pl modules/cli   -am verify
      - if: steps.tagpr.outputs.tag != ''
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            modules/jmc/target/verbatime-jmc-plugin.jar
            modules/cli/target/verbatime-cli.jar
            modules/cli/install-cli.sh
      - if: steps.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            modules/jmc/target/verbatime-jmc-plugin.jar \
            modules/cli/target/verbatime-cli.jar \
            modules/cli/install-cli.sh \
            --clobber

  maven-central:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: maven-central
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
      - env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        run: nix develop .#agent --command mvn -B -s .github/maven-settings.xml -Prelease -pl modules/agent -am deploy
      - uses: actions/attest@v4.2.2
        with:
          subject-path: modules/agent/target/verbatime-agent.jar
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh release upload "$TAG" modules/agent/target/verbatime-agent.jar --clobber

  cli-native:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1.6.7
        with:
          java-version: "25"
          distribution: graalvm-community
      - run: mvn -B -pl modules/cli -am -Pnative -DskipTests package
      - run: modules/cli/target/vbtm --help
      - run: |
          cp modules/cli/target/vbtm "vbtm-${{ matrix.platform }}"
          shasum -a 256 "vbtm-${{ matrix.platform }}" > "vbtm-${{ matrix.platform }}.sha256"
      - uses: actions/attest@v4.2.2
        with:
          subject-path: vbtm-${{ matrix.platform }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "vbtm-${{ matrix.platform }}" \
            "vbtm-${{ matrix.platform }}.sha256" \
            --clobber

  publish:
    needs: [tagpr, maven-central, cli-native]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  homebrew:
    needs: [tagpr, publish]
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: read
    uses: yagipass/homebrew-tap/.github/workflows/bump.yml@main
    with:
      formula: vbtm
      tag: ${{ needs.tagpr.outputs.tag }}
    secrets:
      tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  examples:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/examples.yml
    with:
      version: ${{ needs.tagpr.outputs.tag }}

  docs:
    needs: [tagpr, maven-central]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
      - run: nix develop .#docs --command sh -c 'cd docs && pnpm install --frozen-lockfile && pnpm run build'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop .#docs --command sh -c 'cd docs && pnpm exec wrangler deploy'
