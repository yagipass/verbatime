name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.tagpr.outputs.tag != ''
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - if: steps.tagpr.outputs.tag != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - if: steps.tagpr.outputs.tag != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: m2-release-${{ hashFiles('pom.xml', 'modules/format/pom.xml', 'modules/agent/pom.xml', 'modules/jmc/pom.xml', 'modules/cli/pom.xml') }}
          restore-keys: |
            m2-agent-
            m2-jmc-
            m2-cli-
      - if: steps.tagpr.outputs.tag != ''
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        run: nix develop .#agent --command mvn -B -s .github/maven-settings.xml -Prelease -pl modules/agent -am deploy
      - if: steps.tagpr.outputs.tag != ''
        run: |
          nix develop .#jmc   --command mvn -B -pl modules/jmc   -am verify
          nix develop .#cli   --command mvn -B -pl modules/cli   -am verify
      - if: steps.tagpr.outputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            modules/agent/target/verbatime-agent.jar
            modules/jmc/target/verbatime-jmc-plugin.jar
            modules/cli/target/verbatime-cli.jar
      - if: steps.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            modules/agent/target/verbatime-agent.jar \
            modules/jmc/target/verbatime-jmc-plugin.jar \
            modules/cli/target/verbatime-cli.jar \
            --clobber

  cli-native:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276
        with:
          java-version: "25"
          distribution: graalvm-community
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: m2-cli-${{ matrix.platform }}-${{ hashFiles('pom.xml', 'modules/format/pom.xml', 'modules/cli/pom.xml') }}
          restore-keys: m2-cli-
      - run: mvn -B -pl modules/cli -am -Pnative -DskipTests package
      - run: modules/cli/target/vbtm --help
      - run: cp modules/cli/target/vbtm "vbtm-${{ matrix.platform }}"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: vbtm-${{ matrix.platform }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh release upload "$TAG" "vbtm-${{ matrix.platform }}" --clobber

  docs:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop .#docs --command sh -c 'cd docs && npm ci --ignore-scripts && npm run build'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop .#docs --command sh -c 'cd docs && npx wrangler deploy'
