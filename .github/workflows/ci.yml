name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-agent-corpus-full-${{ hashFiles('pom.xml', 'modules/format/pom.xml', 'modules/agent/pom.xml') }}
          restore-keys: m2-agent-
      - run: nix develop .#agent --command mvn -B -pl modules/agent -am verify -Pcorpus-full

  jmc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-jmc-${{ hashFiles('pom.xml', 'modules/format/pom.xml', 'modules/jmc/pom.xml') }}
          restore-keys: m2-jmc-
      - run: nix develop .#jmc --command mvn -B -pl modules/jmc -am verify

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-cli-${{ hashFiles('pom.xml', 'modules/format/pom.xml', 'modules/cli/pom.xml') }}
          restore-keys: m2-cli-
      - run: nix develop .#cli --command mvn -B -pl modules/cli -am verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: verbatime
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop .#docs --command sh -c 'cd docs && pnpm install --frozen-lockfile && pnpm run build && pnpm exec wrangler deploy --dry-run'
